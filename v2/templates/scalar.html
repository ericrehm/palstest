<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PALS V2 Scalar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    .viewer-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .viewer-row label { font-size: 0.9em; color: #aaa; margin-right: 4px; }
    select, input[type="file"] { background: #2a2a2a; color: #e0e0e0; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; }
    #loadStatus { color: #999; font-size: 0.9em; }
    #loadStatus.error { color: #ff6666; }
    .tab-nav { display: flex; gap: 8px; margin-top: 10px; }
    .tab-nav a {
      padding: 8px 16px; border-radius: 6px; text-decoration: none;
      color: #ccc; background: #2a2a2a; border: 1px solid #444; font-weight: 500;
    }
    .tab-nav a:hover { background: #333; color: #fff; }
    .tab-nav a.active { background: #3a6ea5; color: #fff; border-color: #3a6ea5; }
    .scalar-btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .scalar-btn {
      padding: 8px 18px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a;
      color: #ccc; font-weight: 500; cursor: pointer;
    }
    .scalar-btn:hover:not(:disabled) { background: #333; color: #fff; }
    .scalar-btn.active { background: #3a6ea5; color: #fff; border-color: #3a6ea5; }
    .scalar-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #scalarChart { width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PALS V2 Scalar Viewer</h1>
      <div class="instrument-id">Instrument: {{ instrument }}</div>
      <nav class="tab-nav">
        <a href="/" class="{{ 'active' if active_tab == 'processing' else '' }}">Processing</a>
        <a href="/viewer" class="{{ 'active' if active_tab == 'viewer1' else '' }}">Browse</a>
        <a href="/compare" class="{{ 'active' if active_tab == 'viewer2' else '' }}">Compare</a>
        <a href="/scalar" class="{{ 'active' if active_tab == 'scalar' else '' }}">Scalar</a>
      </nav>
    </header>

    <div class="section">
      <div class="viewer-row">
        <label>File(s)</label>
        <input type="file" id="filesInput" accept=".csv" multiple>
        <label>or Directory</label>
        <input type="file" id="dirInput" webkitdirectory multiple>
        <button type="button" id="loadBtn" disabled>Load</button>
        <span id="loadStatus"></span>
      </div>

      <div class="scalar-btn-row">
        <button type="button" class="scalar-btn" data-scalar="klidar" disabled>K_lidar</button>
        <button type="button" class="scalar-btn" data-scalar="cest" disabled>c_est</button>
        <button type="button" class="scalar-btn" data-scalar="power" disabled>Power</button>
        <button type="button" class="scalar-btn" data-scalar="temp" disabled>Laser Temp</button>
        <button type="button" class="scalar-btn" data-scalar="attitude" disabled>Attitude</button>
      </div>

      <div id="scalarChart"></div>
    </div>
  </div>

  <script>
    const filesInput = document.getElementById('filesInput');
    const dirInput = document.getElementById('dirInput');
    const loadBtn = document.getElementById('loadBtn');
    const loadStatus = document.getElementById('loadStatus');
    const scalarButtons = Array.from(document.querySelectorAll('.scalar-btn'));

    // Same PM-sibling and pipeline-stage-tag conventions used everywhere
    // else in this app (index_v2.html's STAGE_TAG_RE, viewer.html's
    // STAGE_PATTERNS) -- a directory scan should skip PM files entirely and
    // detect each remaining file's level from its own filename, since a
    // real directory can hold files from multiple pipeline stages at once
    // (only L2 files carry K_lidar/c_est, but power/temp/attitude exist at
    // every level).
    const PM_RE = /PM|power.?monitor|_power\.csv/i;
    const LEVEL_TAG_RE = { l2: /_L2_\d+\.csv$/i, l1: /_L1_\d+\.csv$/i, l0b: /_L0b_\d+\.csv$/i };

    function detectLevel(filename) {
      if (LEVEL_TAG_RE.l2.test(filename)) return 'l2';
      if (LEVEL_TAG_RE.l1.test(filename)) return 'l1';
      if (LEVEL_TAG_RE.l0b.test(filename)) return 'l0b';
      return 'raw';
    }

    let pendingFiles = [];   // File objects currently selected, from either input
    let allShots = [];       // merged, timestamp-sorted per-shot scalar records
    let t0Ms = 0;
    let activeScalar = 'klidar';
    // Per-file PMT gain diagnostic: gain is constant across every shot in a
    // file (see app_v2._pmt_gains_for_file), so this tracks one entry per
    // loaded file -- {filename, minTs, maxTs, pmt_gains} -- rather than
    // repeating the same 6 values on every shot row. Sorted by minTs once
    // t0Ms is known, same ordering as allShots.
    let fileSegments = [];

    function collectPendingFiles() {
      const combined = [...(filesInput.files || []), ...(dirInput.files || [])];
      // De-dup by name+size -- picking one input after the other could overlap.
      const seen = new Set();
      pendingFiles = [];
      for (const f of combined) {
        if (!f.name.toLowerCase().endsWith('.csv') || PM_RE.test(f.name)) continue;
        const key = `${f.name}:${f.size}`;
        if (seen.has(key)) continue;
        seen.add(key);
        pendingFiles.push(f);
      }
      loadStatus.classList.remove('error');
      loadStatus.textContent = pendingFiles.length ? `${pendingFiles.length} file(s) selected` : '';
      loadBtn.disabled = pendingFiles.length === 0;
    }

    filesInput.addEventListener('change', collectPendingFiles);
    dirInput.addEventListener('change', collectPendingFiles);

    async function loadOneFile(file) {
      const formData = new FormData();
      formData.append('file', file, file.name);
      formData.append('originalFilename', file.name);
      formData.append('fileType', detectLevel(file.name));
      const response = await fetch('/api/scalar/load', { method: 'POST', body: formData });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `Failed to load ${file.name}`);
      return payload;
    }

    loadBtn.addEventListener('click', async () => {
      if (!pendingFiles.length) return;
      loadBtn.disabled = true;
      loadStatus.classList.remove('error');
      allShots = [];
      fileSegments = [];
      let loaded = 0;
      try {
        for (const file of pendingFiles) {
          loadStatus.textContent = `Loading ${file.name} (${loaded + 1}/${pendingFiles.length})...`;
          const payload = await loadOneFile(file);
          const shots = payload.shots || [];
          if (shots.length) {
            // min/max via a manual scan, not Math.min(...timestamps) --
            // spreading thousands of shots into a single call risks
            // blowing the engine's argument-count limit on a large file.
            let minTs = Infinity, maxTs = -Infinity;
            for (const s of shots) {
              if (s.timestamp_ms < minTs) minTs = s.timestamp_ms;
              if (s.timestamp_ms > maxTs) maxTs = s.timestamp_ms;
            }
            fileSegments.push({
              filename: payload.filename || file.name,
              minTs, maxTs,
              pmt_gains: payload.pmt_gains || {},
            });
          }
          allShots.push(...shots);
          loaded++;
        }
        allShots.sort((a, b) => a.timestamp_ms - b.timestamp_ms);
        fileSegments.sort((a, b) => a.minTs - b.minTs);
        t0Ms = allShots.length ? allShots[0].timestamp_ms : 0;
        loadStatus.textContent = `Loaded ${allShots.length} shots from ${loaded} file(s)`;
        scalarButtons.forEach((btn) => { btn.disabled = false; });
        renderScalarPlot();
      } catch (err) {
        loadStatus.classList.add('error');
        loadStatus.textContent = String((err && err.message) || err);
      } finally {
        loadBtn.disabled = false;
      }
    });

    scalarButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        activeScalar = btn.dataset.scalar;
        scalarButtons.forEach((b) => b.classList.toggle('active', b === btn));
        renderScalarPlot();
      });
    });
    scalarButtons[0].classList.add('active');

    function formatMMSS(ms) {
      const totalSec = Math.max(0, Math.round(ms / 1000));
      const mm = Math.floor(totalSec / 60);
      const ss = totalSec % 60;
      return `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    }

    function elapsedS(row) { return (row.timestamp_ms - t0Ms) / 1000; }

    // mm:ss tick labels for the elapsed-seconds x-axis -- Plotly's linear-
    // axis tickformat is d3-format (numeric only, no minutes/seconds), so
    // ticks are built by hand rather than via a 'date' axis type (which
    // would wrap minutes at each hour). Same approach as
    // analyze_peaks_vs_power.py's _time_ticks.
    const TIME_TICK_STEPS_S = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200];
    function timeTicks(maxElapsedS, targetTicks = 8) {
      let step = TIME_TICK_STEPS_S[TIME_TICK_STEPS_S.length - 1];
      for (const candidate of TIME_TICK_STEPS_S) {
        if (maxElapsedS / candidate <= targetTicks) { step = candidate; break; }
      }
      const nTicks = Math.floor(maxElapsedS / step) + 2;
      const tickvals = [];
      const ticktext = [];
      for (let i = 0; i < nTicks; i++) {
        const v = i * step;
        tickvals.push(v);
        ticktext.push(formatMMSS(v * 1000));
      }
      return { tickvals, ticktext };
    }

    // K_lidar is fit for the two Raman channels too (raman_near/raman_far,
    // each against its own nf/ff window -- see L2Constants.
    // k_lidar_fit_window_raman_*_m), but c_est is not (yet) extended to
    // them, so CEST_IDENTITIES stays the original four-channel list.
    const CEST_IDENTITIES = ['co_near', 'cross_near', 'co_far', 'cross_far'];
    const KLIDAR_IDENTITIES = ['co_near', 'cross_near', 'co_far', 'cross_far', 'raman_near', 'raman_far'];
    const IDENTITY_COLORS = {
      co_near: '#22c55e', cross_near: '#eab308', co_far: '#0ea5e9', cross_far: '#ef4444',
      raman_near: '#a855f7', raman_far: '#ec4899',
    };

    // PMT gain diagnostic strip: all 6 channels, regardless of whether
    // K_lidar is fit for them -- gain is a property of the detector, not of
    // the fit. Rendered as a heatmap so a gain change (a step, not a
    // gradual drift) shows up as a sharp color change at the file boundary
    // where it happened.
    const GAIN_CHANNELS = ['co_near', 'cross_near', 'co_far', 'cross_far', 'raman_near', 'raman_far'];

    // One horizontal bar per loaded file, based/widthed to that file's own
    // real [minTs, maxTs] span so each file renders as one solid block --
    // NOT a heatmap: Plotly.js's heatmap calc() throws "Cannot read
    // properties of undefined (reading 'length')" once more than one
    // heatmap trace shares an axis and any one of them contributes only a
    // single category row (reproduced with plain dummy data, so it's a
    // Plotly bug/limitation, not something wrong with our data) -- which is
    // exactly the one-trace-per-channel shape needed below. A bar trace's
    // marker.color/colorscale has no such restriction and, as a bonus, is
    // naturally scoped to that one trace already -- see the per-channel
    // autoscale note below.
    //
    // One trace PER CHANNEL (not one trace covering all 6 rows, for the
    // Plotly-heatmap reason above), but ALL SIX SHARE ONE explicit
    // marker.cmin/cmax -- computed once, below, from every gain value in
    // the loaded dataset. Without an explicit shared cmin/cmax, each bar
    // trace's marker.color would autoscale to *that trace's own* min/max,
    // and two completely different absolute voltages (e.g. co_near's
    // -350V and raman_far's -525V) could render as the same color just
    // because each happened to sit at the same relative position within
    // its own channel's (possibly near-flat) range -- gain is a physical
    // voltage, so the same voltage must always render the same color,
    // comparable across channels, not just relative to its own channel's
    // history.
    function buildGainStripTraces() {
      if (!fileSegments.length) return [];
      let gMin = Infinity, gMax = -Infinity;
      for (const f of fileSegments) {
        for (const ch of GAIN_CHANNELS) {
          const g = f.pmt_gains[ch];
          if (g == null) continue;
          if (g < gMin) gMin = g;
          if (g > gMax) gMax = g;
        }
      }
      if (!isFinite(gMin)) return [];

      return GAIN_CHANNELS.map((ch) => {
        const base = [], width = [], color = [], customdata = [];
        for (const f of fileSegments) {
          const gain = f.pmt_gains[ch];
          if (gain == null) continue; // no matching header line for this channel/file
          base.push((f.minTs - t0Ms) / 1000);
          width.push((f.maxTs - f.minTs) / 1000);
          color.push(gain);
          customdata.push([f.filename, gain]);
        }
        if (!base.length) return null;
        return {
          type: 'bar', orientation: 'h',
          base, x: width, y: base.map(() => ch),
          // Gain tracks |voltage|, and these setpoints are all negative, so
          // the most negative (highest-gain) value must land on 'Hot's
          // white/hot end, not its black/cool end -- 'Hot' alone maps
          // low-to-high (most-negative-to-least-negative) to black-to-
          // white, which is backwards here; reversescale flips that so
          // min(color) (most negative, highest gain) -> hot and max(color)
          // (least negative, lowest gain) -> cool.
          marker: { color, colorscale: 'Viridis', reversescale: true, cmin: gMin, cmax: gMax },
          customdata,
          hovertemplate: `<b>${ch}</b> gain: %{customdata[1]:.1f} V<br>%{customdata[0]}<extra></extra>`,
          showlegend: false,
          xaxis: 'x', yaxis: 'y2',
          width: 0.9,
        };
      }).filter(Boolean);
    }

    // QAK > 1 overlay markers -- distinct by flag value, not by identity
    // (an identity's own base trace color already carries that), so a QA
    // issue reads the same way regardless of which channel it's on. QAK=9
    // (MISSING) means K_lidar/c_est itself is null -- there's no y-value to
    // overlay a marker onto, so those rows are naturally excluded by the
    // `r[field] != null` filter below and this trace ends up empty/skipped.
    const QAK_MARKERS = {
      3: { symbol: 'triangle-up', color: '#f5a623', name: 'SUSPECT (QAK=3)' },
      4: { symbol: 'x', color: '#e74c3c', name: 'FAIL (QAK=4)' },
      9: { symbol: 'square-open', color: '#888888', name: 'MISSING (QAK=9)' },
    };

    function buildKlidarTraces(field, valueLabel, identities) {
      const traces = [];
      for (const identity of identities) {
        const rows = allShots.filter((r) => r.identity === identity && r[field] != null);
        if (!rows.length) continue;
        traces.push({
          x: rows.map(elapsedS), y: rows.map((r) => r[field]),
          mode: 'lines+markers', name: identity,
          line: { color: IDENTITY_COLORS[identity], width: 1.5 },
          marker: { color: IDENTITY_COLORS[identity], size: 5 },
          text: rows.map((r) => formatMMSS(r.timestamp_ms - t0Ms)),
          hovertemplate: `<b>${identity}</b><br>t=%{text}<br>${valueLabel}: %{y}<extra></extra>`,
        });
      }
      for (const flag of [3, 4, 9]) {
        const flagged = allShots.filter(
          (r) => identities.includes(r.identity) && r[field] != null && r.qak_flag === flag
        );
        if (!flagged.length) continue;
        const style = QAK_MARKERS[flag];
        traces.push({
          x: flagged.map(elapsedS), y: flagged.map((r) => r[field]),
          mode: 'markers', name: style.name,
          marker: { symbol: style.symbol, color: style.color, size: 10, line: { width: 1.5, color: style.color } },
          text: flagged.map((r) => `${r.identity} t=${formatMMSS(r.timestamp_ms - t0Ms)}`),
          hovertemplate: `<b>%{text}</b><br>${valueLabel}: %{y}<extra></extra>`,
        });
      }
      return traces;
    }

    // In-situ ac-s reference values (see app_v2.py's L2 route /
    // iop_geo.profiles.IOPWindowAverage): depth-averaged, c_water-corrected
    // total attenuation ct(532)/ct(650) from whichever ac-s cast is
    // contemporaneous with a shot, over that shot's own K_lidar fit window
    // (nf/ff for ct532, raman_nf/raman_ff for ct650) -- directly comparable
    // to K_lidar (also total attenuation), unlike c_est. Constant across
    // every shot matched to the same cast, so drawn as a fat, translucent
    // line (not markers) spanning the matched range -- a marker per shot
    // would just be a dense, opaque smear of overlapping symbols; a
    // translucent band still shows where/how far K_lidar departs from it
    // while letting the actual per-shot identity lines/markers underneath
    // show through. Scoped to the same six real channels K_lidar/c_est use
    // (KLIDAR_IDENTITIES) rather than also the qer_/depol_/ensemble_snr
    // synthetic rows, which would just repeat the same handful of distinct
    // values with no extra information. Listed (and therefore drawn) after
    // the identity traces in SCALAR_CONFIG below, so the translucent bands
    // sit on top -- required for "see-through", not just cosmetic order.
    const IOP_TRACE_SPECS = [
      { field: 'ct532_near', name: 'ac-s ct(532) NF', color: 'rgba(74, 222, 128, 0.35)' },
      { field: 'ct532_far', name: 'ac-s ct(532) FF', color: 'rgba(56, 189, 248, 0.35)' },
      { field: 'ct650_near', name: 'ac-s ct(650) NF', color: 'rgba(192, 132, 252, 0.35)' },
      { field: 'ct650_far', name: 'ac-s ct(650) FF', color: 'rgba(244, 114, 182, 0.35)' },
    ];

    function buildIopTraces() {
      const traces = [];
      for (const spec of IOP_TRACE_SPECS) {
        const rows = allShots.filter((r) => KLIDAR_IDENTITIES.includes(r.identity) && r[spec.field] != null);
        if (!rows.length) continue;
        traces.push({
          x: rows.map(elapsedS), y: rows.map((r) => r[spec.field]),
          mode: 'lines', name: spec.name,
          line: { color: spec.color, width: 10 },
          text: rows.map((r) => `${r.identity} t=${formatMMSS(r.timestamp_ms - t0Ms)}`),
          hovertemplate: `<b>%{text}</b><br>${spec.name}: %{y}<extra></extra>`,
        });
      }
      return traces;
    }

    function buildPowerTraces() {
      return [
        {
          x: allShots.map(elapsedS), y: allShots.map((r) => r.power_a_sum),
          mode: 'lines', name: 'PowerASum', line: { color: '#0ea5e9', width: 1.5 },
        },
        {
          x: allShots.map(elapsedS), y: allShots.map((r) => r.power_b_sum),
          mode: 'lines', name: 'PowerBSum', line: { color: '#f97316', width: 1.5 },
        },
      ];
    }

    function buildTempTraces() {
      return [{
        x: allShots.map(elapsedS), y: allShots.map((r) => r.laser_temp_c),
        mode: 'lines', name: 'LaserTempC', line: { color: '#7dd3fc', width: 1.8 },
      }];
    }

    function buildAttitudeTraces() {
      return [
        { x: allShots.map(elapsedS), y: allShots.map((r) => r.roll), mode: 'lines', name: 'Roll', line: { color: '#7dd3fc', width: 1.1 } },
        { x: allShots.map(elapsedS), y: allShots.map((r) => r.pitch), mode: 'lines', name: 'Pitch', line: { color: '#ffb347', width: 1.1 } },
        { x: allShots.map(elapsedS), y: allShots.map((r) => r.yaw), mode: 'lines', name: 'Yaw', line: { color: '#f472b6', width: 1.1 } },
      ];
    }

    const SCALAR_CONFIG = {
      klidar: {
        build: () => [...buildKlidarTraces('k_lidar', 'K_lidar', KLIDAR_IDENTITIES), ...buildIopTraces()],
        yTitle: 'K_lidar (1/m)',
      },
      cest: {
        build: () => [...buildKlidarTraces('c_est', 'c_est', CEST_IDENTITIES), ...buildIopTraces()],
        yTitle: 'c_est (1/m)',
      },
      power: { build: buildPowerTraces, yTitle: 'Power (arb. units)' },
      temp: { build: buildTempTraces, yTitle: 'LaserTempC' },
      attitude: { build: buildAttitudeTraces, yTitle: 'Attitude (deg)' },
    };

    function renderScalarPlot() {
      if (!allShots.length) return;
      const cfg = SCALAR_CONFIG[activeScalar];
      const traces = cfg.build();
      const maxElapsedS = (allShots[allShots.length - 1].timestamp_ms - t0Ms) / 1000;
      const { tickvals, ticktext } = timeTicks(maxElapsedS);

      // The gain strip shares xaxis 'x' with the main traces (yaxis2 is
      // just a second row on the same x) rather than a separate subplot, so
      // zooming/panning the timeline moves both together for free -- no
      // manual sync needed.
      const gainTraces = buildGainStripTraces();
      const allTraces = gainTraces.length ? [...traces, ...gainTraces] : traces;

      const layout = {
        height: 600,
        margin: { l: 70, r: 20, t: 30, b: 60 },
        paper_bgcolor: '#1a1a1a',
        plot_bgcolor: '#1a1a1a',
        font: { color: '#e0e0e0' },
        hovermode: 'closest',
        showlegend: true,
        legend: { orientation: 'h', y: 1.12 },
        // 'overlay', not Plotly's default 'group' -- the 6 gain-strip bar
        // traces each place their own bars by explicit base/width, several
        // sharing the same y category (channel) across different files;
        // 'group' would offset them side by side within that category
        // instead of positioning them along the (shared) time axis.
        barmode: 'overlay',
        xaxis: { title: 'Time (mm:ss)', tickmode: 'array', tickvals, ticktext, gridcolor: '#333' },
        yaxis: { title: cfg.yTitle, gridcolor: '#333', domain: gainTraces.length ? [0, 0.82] : [0, 1] },
        // A thin row at the top of the plot area (below the legend) for the
        // PMT gain strip -- one overall "PMT gain" title, but still no
        // per-channel tick labels per the "just a sparkline" ask.
        // categoryarray pins the 6 channels' stacking order (Plotly would
        // otherwise order them by first-appearance across the 6 separate
        // traces, which happens to match GAIN_CHANNELS anyway, but this
        // makes it explicit). fixedrange since it carries no meaningful
        // y-zoom.
        yaxis2: {
          domain: [0.88, 0.98], anchor: 'x',
          title: { text: 'PMT gain', font: { size: 11, color: '#999' }, standoff: 4 },
          categoryorder: 'array', categoryarray: GAIN_CHANNELS,
          showticklabels: false, ticks: '', showgrid: false, zeroline: false, fixedrange: true,
        },
        // Per-scalar-type uirevision, same reasoning as v1's waveform tabs:
        // Plotly.react preserves zoom/pan across a reload of the same
        // scalar type, but switching type (different axis meaning/scale)
        // resets the view.
        uirevision: activeScalar,
      };

      Plotly.react('scalarChart', allTraces, layout, { displayModeBar: true, responsive: true });
    }
  </script>
</body>
</html>
